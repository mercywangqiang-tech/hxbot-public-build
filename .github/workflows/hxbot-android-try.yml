# HXBot 安卓试包（公开打包仓库）：一次运行打几个提交的安卓测试包，每个包在模拟器上跑几遍 vi-android-check。
# 代码在私有仓库，每次用只读令牌现拉。步骤和 hxbot-build.yml 的 android、vi-check-android 相同。
name: HXBot android try
run-name: HXBot android try ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      refs:
        description: "要打包的分支或提交（逗号分隔，1～4 个）"
        required: true
      checks:
        description: "每个包在模拟器上查几遍（1～3）"
        default: "3"
      label:
        description: "标签（字母、数字、- 和 _）"
        default: "try"

permissions:
  contents: read

concurrency:
  group: hxbot-android-try-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - id: plan
        env:
          REFS: ${{ inputs.refs }}
          CHECKS: ${{ inputs.checks }}
        run: |
          python3 - <<'PY'
          import json, os, re
          refs = [r.strip() for r in os.environ["REFS"].split(",") if r.strip()]
          if not 1 <= len(refs) <= 4 or not all(re.fullmatch(r"[A-Za-z0-9._/-]{1,80}", r) for r in refs):
              raise SystemExit("refs: 1 to 4 branch names or commits")
          passes = int(os.environ["CHECKS"])
          if not 1 <= passes <= 3:
              raise SystemExit("checks: 1 to 3")
          builds = [{"n": i + 1, "ref": r} for i, r in enumerate(refs)]
          checks = [{**b, "pass": p + 1} for b in builds for p in range(passes)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"builds={json.dumps({'include': builds})}\n")
              out.write(f"checks={json.dumps({'include': checks})}\n")
          PY

  android:
    name: android ${{ matrix.n }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - name: Free runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Disk after cleanup
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / /mnt || df -h /
      - uses: actions/checkout@v6
        with:
          repository: mercywangqiang-tech/hx-bot-build-2026-11-15-v170
          ref: ${{ matrix.ref }}
          token: ${{ secrets.HX_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Show the commit
        run: git log -1 --format='%H %s'
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Give Gradle more memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          echo 'org.gradle.workers.max=2' >> ~/.gradle/gradle.properties
          SWAP=/mnt/swapfile-build; [ -d /mnt ] && [ -w /mnt ] || SWAP=/swapfile-build
          sudo fallocate -l 8G "$SWAP" && sudo chmod 600 "$SWAP" && sudo mkswap "$SWAP" && sudo swapon "$SWAP" || echo "::warning::swap 未启用"
      - run: bash hx/scripts/build-android.sh
      - name: APK checksum
        run: sha256sum dist-hx/HXBot-*-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: hxbot-android-try-${{ matrix.n }}
          path: dist-hx/HXBot-*-android.apk
          if-no-files-found: error
          retention-days: 1

  vi-check-android:
    name: check ${{ matrix.n }}.${{ matrix.pass }}
    needs: [plan, android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: mercywangqiang-tech/hx-bot-build-2026-11-15-v170
          ref: ${{ matrix.ref }}
          token: ${{ secrets.HX_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install Pillow, numpy and ffmpeg
        run: |
          python -m pip install pillow numpy
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/download-artifact@v8
        with:
          name: hxbot-android-try-${{ matrix.n }}
          path: new
      - name: APK checksum
        run: sha256sum new/HXBot-*-android.apk
      - name: Check on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python hx/scripts/vi-android-check.py --apk "$(ls new/HXBot-*-android.apk | head -1)" --out out
      - name: Show the summary
        if: always()
        shell: bash
        run: python hx/scripts/vi-android-check.py --summary --out out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hxbot-vi-check-android-${{ matrix.n }}-${{ matrix.pass }}
          path: out
          if-no-files-found: warn
          retention-days: 7
