              '["Noto Serif CJK SC",["SimSun","宋体","NSimSun","新宋体","FangSong","仿宋","KaiTi","楷体","STSong","华文宋体","Songti SC","Noto Serif SC","Source Han Serif SC","FangSong_GB2312","仿宋_GB2312","KaiTi_GB2312","楷体_GB2312","STKaiti","华文楷体","STFangsong","华文仿宋","STZhongsong","华文中宋","LiSu","隶书","SimSun-ExtB","Kaiti SC","Source Han Serif CN","思源宋体","思源宋体 CN","方正小标宋简体","方正仿宋简体","方正楷体简体","方正书宋简体"]],'
              '["Noto Sans CJK SC",["Microsoft YaHei","微软雅黑","Microsoft YaHei UI","SimHei","黑体","DengXian","等线","PingFang SC","Heiti SC","STHeiti","华文黑体","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","DengXian Light","等线 Light","Microsoft YaHei Light","微软雅黑 Light","Source Han Sans CN","思源黑体","思源黑体 CN","YouYuan","幼圆","STXihei","华文细黑","方正黑体简体","苹方-简","黑体-简","HarmonyOS Sans SC","MiSans"]],'
              '["Noto Serif CJK TC",["PMingLiU","新細明體","MingLiU","細明體","DFKai-SB","標楷體","Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU-ExtB","MingLiU-ExtB","Kaiti TC","BiauKai","思源宋體","Source Han Serif TW","LiSong Pro","儷宋 Pro"]],'
              '["Noto Sans CJK TC",["Microsoft JhengHei","微軟正黑體","Microsoft JhengHei UI","PingFang TC","Heiti TC","Noto Sans TC","Source Han Sans TC","Microsoft JhengHei Light","微軟正黑體 Light","思源黑體","LiHei Pro","Apple LiGothic","Source Han Sans TW","蘋方-繁","儷黑 Pro"]],'
              '["Noto Serif CJK HK",["MingLiU_HKSCS","細明體_HKSCS","Noto Serif HK","MingLiU_HKSCS-ExtB","Source Han Serif HC","Source Han Serif HK"]],'
              '["Noto Sans CJK HK",["PingFang HK","Noto Sans HK","Source Han Sans HK","Source Han Sans HC"]],'
              '["Noto Sans Mono CJK JP",["MS Gothic","ＭＳ ゴシック","MS ゴシック"]],'
              '["Noto Sans Mono CJK KR",["GulimChe","굴림체","DotumChe","돋움체","D2Coding"]]]'
          )
          PAGES_JS = """const [root, onlyText, exactFile, shardsText, out] = process.argv.slice(2);
          const { rangeTaskPages } = await import(`${root}/scripts/hx-range/catalog.ts`);
          const known = rangeTaskPages().map((page) => page.id);
          let ids;
          if (exactFile) {
            ids = JSON.parse(await Bun.file(exactFile).text());
            const missing = ids.filter((id) => !known.includes(id));
            if (missing.length) throw new Error(`unknown pages: ${missing.length}`);
          } else {
            const prefixes = onlyText.split(",").filter(Boolean);
            ids = known.filter((id) => prefixes.length === 0 || prefixes.some((prefix) => id.startsWith(prefix)));
          }
          const count = Number(shardsText);
          const shards = Array.from({ length: count }, (_, index) => ids.filter((_, k) => k % count === index));
          await Bun.write(out, JSON.stringify({ all: ids.length, shards }));
          """
          _print_lock = threading.Lock()


          def canonical(value) -> str:
              return json.dumps(value, sort_keys=True, ensure_ascii=False, separators=(",", ":"))


          def stable(value) -> str:
              text = canonical(value)
              for pattern, replacement in VOLATILE:
                  text = pattern.sub(replacement, text)
              return text


          def sha16(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()[:16]


          def task_key(result: dict) -> str:
              return f"{result.get('page')}|{','.join(result.get('faults') or [])}|{result.get('pass')}"


          def task_record(result: dict) -> dict:
              record = {field: result.get(field) for field in COMPARED}
              record["truth"] = stable(result.get("truth"))
              return record


          def task_fp(result: dict) -> str:
              return sha16(canonical(task_record(result)))


          def page_group(page) -> str:
              return "/".join(str(page).split("/")[:2])


          def is_bad(result: dict) -> bool:
              return not result.get("ok") or bool(result.get("falseSuccess")) or bool(result.get("falseFailure"))


          def percentile(values: list, p: float):
              if not values:
                  return 0
              ordered = sorted(values)
              return ordered[min(len(ordered) - 1, math.floor((p / 100) * len(ordered)))]


          def summarize(results: list) -> dict:
              ran = len(results)
              ok = sum(1 for item in results if item.get("ok"))
              calls = [item.get("calls", 0) for item in results]
              chars = [item.get("chars", 0) for item in results]
              task_ms = [item.get("ms", 0) for item in results]
              step_ms = [value for item in results for value in (item.get("stepMs") or [])]
              summary = {
                  "tasks": ran,
                  "ok": ok,
                  "accuracy": ok / ran if ran else 0,
                  "falseSuccess": sum(1 for item in results if item.get("falseSuccess")),
                  "falseFailure": sum(1 for item in results if item.get("falseFailure")),
                  "roundTrips": {"total": sum(calls), "median": percentile(calls, 50), "p95": percentile(calls, 95)},
                  "chars": {"total": sum(chars), "median": percentile(chars, 50), "p95": percentile(chars, 95)},
                  "taskMs": {"median": percentile(task_ms, 50), "p95": percentile(task_ms, 95)},
                  "stepMs": {"median": percentile(step_ms, 50), "p95": percentile(step_ms, 95)},
              }
              if any(item.get("llm") for item in results):
                  summary["llm"] = "not merged"
              return summary


          def merge(parts: list, count: int, only: str = "") -> dict:
              present = [(index, report) for index, report in parts if report is not None]
              real = [(index, report) for index, report in present if not report.get("empty")]
              problems = []
              blocks: dict = {}
              for index, report in present:
                  for result in report.get("results") or []:
                      per = blocks.setdefault(result.get("pass", 1), {}).setdefault(index, [])
                      if per and per[-1][-1].get("page") == result.get("page"):
                          per[-1].append(result)
                      else:
                          per.append([result])
              results = []
              for number in sorted(blocks):
                  per = blocks[number]
                  depth = max(len(rows) for rows in per.values())
                  for position in range(depth):
                      for index in sorted(per):
                          if position < len(per[index]):
                              results.extend(per[index][position])
              first = real[0][1] if real else (present[0][1] if present else {})
              for field in ("sourceSha", "buildId", "mode", "faultMode", "policy", "old"):
                  values = sorted({str(report.get(field)) for _, report in real})
                  if len(values) > 1:
                      problems.append(f"{field} differs between shards: {values}")
              missing = sorted(set(range(1, count + 1)) - {index for index, _ in present})
              unfinished = sorted(index for index, report in present if report.get("status") != "passed")
              if missing:
                  problems.append(f"shards without a report: {missing}")
              if unfinished:
                  problems.append(f"shards not passed: {unfinished}")
              run_ids = sorted(str(report.get("runId")) for _, report in present)
              merged = {"runId": str(uuid.uuid5(uuid.NAMESPACE_URL, "hxrange:" + "|".join(run_ids))),
                        "sourceSha": first.get("sourceSha", "unknown")}
              builds = {report.get("buildId") for _, report in real}
              if len(builds) == 1 and None not in builds:
                  merged["buildId"] = next(iter(builds))
              merged.update({
                  "mode": first.get("mode", "baseline"),
                  "faultMode": first.get("faultMode", "none"),
                  "only": only,
                  "policy": first.get("policy", ""),
                  "old": first.get("old", ""),
                  "status": "failed" if problems else "passed",
              })
              if problems:
                  merged["reason"] = "; ".join(problems)
              merged.update({
                  "pages": sum(int(report.get("pages") or 0) for _, report in present),
                  "summary": summarize(results),
                  "hangs": [item for _, report in present for item in report.get("hangs") or []],
                  "mainFailures": [item for _, report in present for item in report.get("mainFailures") or []],
                  "visionOnly": next((report["visionOnly"] for _, report in real if "visionOnly" in report), []),
                  "results": results,
                  "shards": [{"shard": index, "runId": report.get("runId"), "status": report.get("status"),
                              "tasks": len(report.get("results") or []), "empty": bool(report.get("empty"))}
                             for index, report in present],
              })
              return merged


          def group_table(results: list) -> dict:
              rows: dict = {}
              for result in results:
                  rows.setdefault(page_group(result.get("page")), []).append((task_key(result), task_fp(result), is_bad(result)))
              table = {}
              for name in sorted(rows):
                  items = sorted(rows[name])
                  table[name] = {"tasks": len(items), "bad": sum(1 for item in items if item[2]),
                                 "fp": sha16("\n".join(f"{key} {fp}" for key, fp, _ in items))}
              return table


          def emit(tag: str, payload: dict) -> str:
              return f"{PREFIX}-{tag} {json.dumps(payload, ensure_ascii=True, sort_keys=True, separators=(',', ':'))}"


          def say(line: str) -> None:
              with _print_lock:
                  print(line, flush=True)


          def chunks(items: list, size: int) -> list:
              return [items[start:start + size] for start in range(0, len(items), size)]


          def report_lines(merged: dict, run: int) -> list:
              results = merged.get("results") or []
              summary = merged.get("summary") or {}
              head = {key: summary.get(key) for key in ("tasks", "ok", "accuracy", "falseSuccess", "falseFailure",
                                                         "roundTrips", "chars", "taskMs", "stepMs")}
              head.update({"run": run, "status": merged.get("status"), "problems": merged.get("reason", ""),
                           "sourceSha": merged.get("sourceSha"), "buildId": merged.get("buildId", ""),
                           "runId": merged.get("runId"), "mode": merged.get("mode"), "faultMode": merged.get("faultMode"),
                           "policy": merged.get("policy"), "old": merged.get("old"), "only": merged.get("only"),
                           "shards": [{key: item.get(key) for key in ("shard", "status", "tasks", "empty")}
                                      for item in merged.get("shards") or []]})
              lines = [emit("SUMMARY", head)]
              bad = [[task_key(item), bool(item.get("ok")), bool(item.get("falseSuccess")), bool(item.get("falseFailure"))]
                     for item in results if is_bad(item)]
              for part in chunks(bad[:FAIL_CAP], 25):
                  lines.append(emit("FAIL", {"run": run, "tasks": part}))
              lines.append(emit("FAILCOUNT", {"run": run, "count": len(bad), "printed": min(len(bad), FAIL_CAP)}))
              groups = list(group_table(results).items())
              for part in chunks(groups, 40):
                  lines.append(emit("GROUP", {"run": run, "groups": dict(part)}))
              if len(results) <= TASK_LINES_MAX:
                  rows = [[task_key(item), bool(item.get("ok")), bool(item.get("falseSuccess")),
                           bool(item.get("falseFailure")), item.get("steps"), item.get("calls"), task_fp(item)]
                          for item in results]
                  for part in chunks(rows, 25):
                      lines.append(emit("TASK", {"run": run, "tasks": part}))
              return lines


          def parse_lines(text: str) -> dict:
              found: dict = {"SUMMARY": [], "FAIL": [], "FAILCOUNT": [], "GROUP": [], "TASK": [], "SHARD": [], "ENV": [],
                             "SCAN": [], "DETERMINISM": [], "DONE": [], "B64BEGIN": [], "B64": [], "B64END": []}
              marker = PREFIX + "-"
              for line in text.splitlines():
                  start = line.find(marker)
                  if start < 0:
                      continue
                  tag, _, payload = line[start + len(marker):].partition(" ")
                  if tag not in found or not payload.startswith("{"):
                      continue
                  try:
                      found[tag].append(json.loads(payload))
                  except ValueError:
                      continue
              return found


          def lines_view(found: dict, run: int) -> dict:
              summary = next((item for item in found["SUMMARY"] if item.get("run") == run), None)
              bad = [row for item in found["FAIL"] if item.get("run") == run for row in item.get("tasks", [])]
              count = next((item for item in found["FAILCOUNT"] if item.get("run") == run), {})
              groups: dict = {}
              for item in found["GROUP"]:
                  if item.get("run") == run:
                      groups.update(item.get("groups", {}))
              tasks = [row for item in found["TASK"] if item.get("run") == run for row in item.get("tasks", [])]
              return {"summary": summary, "bad": bad, "badCount": count.get("count", len(bad)),
                      "badComplete": count.get("count", 0) == count.get("printed", 0), "groups": groups, "tasks": tasks}


          def scan_bytes(data: bytes, rules: list, secret: str = "") -> list:
              found = set()
              by_length: dict = {}
              for length, digest, category in rules:
                  by_length.setdefault(int(length), {})[bytes.fromhex(digest)] = category
              sha = hashlib.sha256
              for length, wanted in by_length.items():
                  left = set(wanted.values())
                  for start in range(len(data) - length + 1):
                      category = wanted.get(sha(data[start:start + length]).digest())
                      if category:
                          found.add(category)
                          left.discard(category)
                          if not left:
                              break
              for match in EMAIL.finditer(data):
                  if not EMAIL_OK.search(match.group(1)):
                      found.add("email")
                      break
              if TOKEN.search(data):
                  found.add("token")
              if len(secret) >= 8 and secret.encode("utf-8") in data:
                  found.add("source token")
              return sorted(found)


          def env_info() -> dict:
              def run(command: list) -> str:
                  try:
                      return subprocess.run(command, capture_output=True, text=True, timeout=60).stdout.strip()
                  except (OSError, subprocess.SubprocessError):
                      return ""
              patterns = ("sans-serif", "serif", "monospace", "system-ui", "-apple-system", "PingFang SC", "Microsoft YaHei",
                          "Helvetica", "emoji", "sans-serif:lang=zh-cn", "sans-serif:lang=ja", "monospace:lang=zh-cn")
              fonts = {pattern: run(["fc-match", "-f", "%{family[0]}|%{style[0]}", pattern]) for pattern in patterns}
              families = sorted(set(line.strip() for line in run(["fc-list", ":", "family"]).splitlines() if line.strip()))
              xvfb = ""
              try:
                  xvfb = next((line.split("=", 1)[1].strip('"') for line in Path("/usr/bin/xvfb-run").read_text().splitlines()
                               if line.startswith("XVFBARGS=")), "")
              except OSError:
                  pass
              return {"tz": os.environ.get("TZ", ""), "tzNow": time.strftime("%Z %z"),
                      "lang": os.environ.get("LANG") or "C.UTF-8", "lcAll": os.environ.get("LC_ALL") or "C.UTF-8",
                      "language": os.environ.get("LANGUAGE", ""), "fonts": fonts, "families": len(families),
                      "familiesFp": sha16("\n".join(families)), "xvfb": xvfb}


          def font_files() -> dict:
              inter = "".join(f"  <alias><family>{name}</family><prefer><family>Inter</family></prefer></alias>\n"
                              for name in INTER_FOR)
              lines = []
              for lang, region in CJK_LANGS:
                  for kind, face in CJK_KINDS:
                      lines.append(f'  <match target="pattern"><test name="lang"><string>{lang}</string></test>'
                                   f'<test name="family"><string>{kind}</string></test><edit name="family" mode="prepend">'
                                   f'<string>{face}{region}</string></edit></match>\n')
              for kind, face in CJK_KINDS:
                  lines.append(f"  <alias><family>{kind}</family><prefer><family>{face}JP</family></prefer></alias>\n")
              for face, names in json.loads(FONT_ALIASES):
                  for name in names:
                      lines.append(f'  <alias binding="same"><family>{name}</family><accept><family>{face}</family>'
                                   f"</accept></alias>\n")
              head = '<?xml version="1.0"?>\n<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">\n<fontconfig>\n'
              return {"12-unhinted-grayscale.conf": UNHINTED,
                      "56-prefer-inter.conf": head + inter + "</fontconfig>\n",
                      "63-noto-cjk-first.conf": head + "".join(lines) + "</fontconfig>\n"}


          def write_fonts(target: str, system: str = "/etc/fonts") -> str:
              base = Path(target)
              confd = base / "conf.d"
              confd.mkdir(parents=True, exist_ok=True)
              own = font_files()
              for item in sorted(Path(system, "conf.d").iterdir()):
                  if item.name in own or not item.name.endswith(".conf"):
                      continue
                  link = confd / item.name
                  if not link.exists():
                      link.symlink_to(item.resolve())
              for name, text in own.items():
                  (confd / name).write_text(text, encoding="utf-8")
              main = Path(system, "fonts.conf").read_text(encoding="utf-8")
              include = '<include ignore_missing="yes">conf.d</include>'
              if include not in main:
                  raise SystemExit("fonts.conf has no conf.d include")
              (base / "fonts.conf").write_text(main.replace(include, f'<include ignore_missing="yes">{confd}</include>'),
                                               encoding="utf-8")
              return str(base / "fonts.conf")


          def check_inputs(values: dict) -> list:
              bad = [name for name, rule in INPUT_RULES.items() if name in values and not re.fullmatch(rule, str(values[name]))]
              if ".." in str(values.get("ref", "")):
                  bad.append("ref")
              return bad


          def read_report(path) -> dict | None:
              try:
                  value = json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None
              return value if isinstance(value, dict) else None


          def empty_report(run_id: str, source_sha: str) -> dict:
              return {"runId": run_id, "sourceSha": source_sha, "mode": "baseline", "status": "passed", "empty": True,
                      "pages": 0, "summary": summarize([]), "hangs": [], "mainFailures": [], "results": []}


          def shard_line(report: dict | None, shard: int, run: int, seconds: int, expected: list) -> tuple:
              if report is None:
                  say(emit("SHARD", {"shard": shard, "run": run, "status": "no report", "seconds": seconds}))
                  return False, None
              results = report.get("results") or []
              summary = summarize(results)
              pages = list(dict.fromkeys(item.get("page") for item in results))
              match = report.get("status") != "passed" or pages == list(expected)
              if report.get("status") == "passed" and not results and not expected:
                  match = True
              say(emit("SHARD", {"shard": shard, "run": run, "status": report.get("status"), "seconds": seconds,
                                 "tasks": summary["tasks"], "ok": summary["ok"], "falseSuccess": summary["falseSuccess"],
                                 "falseFailure": summary["falseFailure"], "pages": len(pages), "expected": len(expected),
                                 "selection": "same" if match else "different"}))
              return report.get("status") == "passed" and match, report


          def run_shards(root: str, out: str, shards: list, settings: dict) -> bool:
              root_path, out_path = Path(root), Path(out)
              out_path.mkdir(parents=True, exist_ok=True)
              pages_js = out_path / "hxr-pages.mjs"
              pages_js.write_text(PAGES_JS, encoding="utf-8")
              exact = ""
              if settings.get("pages"):
                  exact = str(out_path / "exact-pages.json")
                  Path(exact).write_text(json.dumps(settings["pages"]), encoding="utf-8")
              listing = out_path / "pages-all.json"
              done = subprocess.run(["bun", str(pages_js), str(root_path), settings.get("only", ""), exact,
                                     str(settings["shards"]), str(listing)], cwd=root_path, capture_output=True)
              if done.returncode != 0:
                  say(emit("SHARD", {"shard": 0, "run": 0, "status": "page list failed", "exit": done.returncode}))
                  return False
              plan = json.loads(listing.read_text(encoding="utf-8"))
              native_shard = bool(re.search(r"\|shard\)=", (root_path / "scripts/hx-range-e2e.ts").read_text(encoding="utf-8")))
              source_sha = subprocess.run(["git", "rev-parse", "HEAD"], cwd=root_path, capture_output=True,
                                          text=True).stdout.strip()
              passes = int(settings.get("passes", 1))
              guard = max(10, int(settings.get("budget", 50)) // passes)

              def one(shard: int) -> bool:
                  folder = out_path / str(shard)
                  folder.mkdir(parents=True, exist_ok=True)
                  expected = plan["shards"][shard - 1]
                  (folder / "pages.json").write_text(json.dumps(expected), encoding="utf-8")
                  args = ["--mode=baseline", f"--policy={settings['policy']}", f"--repeat={settings['repeat']}"]
                  if settings.get("faults"):
                      args.append(f"--faults={settings['faults']}")
                  if settings.get("old"):
                      args.append(f"--old={settings['old']}")
                  if native_shard and not exact:
                      args.append(f"--shard={shard}/{settings['shards']}")
                      if settings.get("only"):
                          args.append(f"--only={settings['only']}")
                  else:
                      args.append(f"--pages={folder / 'pages.json'}")
                  good = True
                  for run in range(1, passes + 1):
                      label = f"{settings['prefix']}-{settings['label']}-{shard}-r{run}"
                      target = folder / f"report-r{run}.json"
                      started = time.monotonic()
                      if not expected:
                          target.write_text(json.dumps(empty_report(str(uuid.uuid4()), source_sha)), encoding="utf-8")
                      else:
                          env = dict(os.environ, HX_RANGE_GUARD_MINUTES=str(guard), LANG="C.UTF-8", LC_ALL="C.UTF-8")
                          env.pop("HX_RANGE_VISION", None)
                          command = ["xvfb-run", "-a", "-n", str(100 + shard * 7), "bun", "scripts/hx-range-e2e.ts", *args,
                                     f"--label={label}"]
                          with open(folder / f"range-r{run}.log", "wb") as log:
                              subprocess.run(command, cwd=root_path, env=env, stdout=log, stderr=subprocess.STDOUT)
                          made = root_path / ".hxbot-build" / f"hx-range-baseline-{label}" / "report.json"
                          if made.exists():
                              target.write_bytes(made.read_bytes())
                              made.unlink()
                              made.parent.rmdir()
                          (folder / f"range-r{run}.log").unlink(missing_ok=True)
                      passed, _ = shard_line(read_report(target), shard, run, round(time.monotonic() - started), expected)
                      good = good and passed
                  return good

              with ThreadPoolExecutor(max_workers=len(shards)) as pool:
                  outcomes = list(pool.map(one, shards))
              return all(outcomes)


          def find_shard_reports(folder: str) -> dict:
              found: dict = {}
              for path in sorted(Path(folder).rglob("report-r*.json")):
                  run = re.fullmatch(r"report-r(\d+)\.json", path.name)
                  shard = re.search(r"(?:^|-)(\d+)$", path.parent.name)
                  if run and shard:
                      found.setdefault(int(run.group(1)), {})[int(shard.group(1))] = read_report(path)
              return found


          def merge_folder(source: str, out: str, count: int, passes: int, only: str) -> bool:
              found = find_shard_reports(source)
              Path(out).mkdir(parents=True, exist_ok=True)
              good = True
              for run in range(1, passes + 1):
                  per = found.get(run, {})
                  merged = merge([(index, per.get(index)) for index in range(1, count + 1)], count, only)
                  Path(out, f"report-r{run}.json").write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
                                                              encoding="utf-8")
                  for line in report_lines(merged, run):
                      say(line)
                  good = good and merged["status"] == "passed"
              say(emit("DONE", {"runs": passes, "shards": count, "passed": good}))
              return good


          def determinism_normalized(reports: list) -> dict:
              problems = []
              if len({report.get("sourceSha") for report in reports}) != 1:
                  problems.append("sourceSha differs")
              if len({report.get("buildId") for report in reports}) != 1:
                  problems.append("buildId differs")
              if len({report.get("runId") for report in reports}) != len(reports):
                  problems.append("runId repeats")
              problems += [f"run {index} status {report.get('status')}" for index, report in enumerate(reports, 1)
                           if report.get("status") != "passed"]
              tables = [{task_key(item): task_record(item) for item in report.get("results") or []} for report in reports]
              keys = sorted(set().union(*tables))
              differing, fields = [], {}
              for key in keys:
                  rows = [table.get(key) for table in tables]
                  if any(row is None for row in rows):
                      differing.append(key)
                      fields["missing"] = fields.get("missing", 0) + 1
                      continue
                  changed = [field for field in rows[0] if len({canonical(row[field]) for row in rows}) > 1]
                  if changed:
                      differing.append(key)
                      for field in changed:
                          fields[field] = fields.get(field, 0) + 1
              return {"tool": "normalized", "deterministic": not differing and not problems, "tasks": len(keys),
                      "same": len(keys) - len(differing), "differing": len(differing), "tasksDiffering": differing[:100],
                      "fields": fields, "problems": problems}


          def determinism_tool(result: dict) -> dict:
              differing = result.get("differing") or []
              keys = sorted({item.get("task") for item in differing if isinstance(item, dict)})
              fields: dict = {}
              for item in differing:
                  name = item.get("field") or "missing"
                  fields[name] = fields.get(name, 0) + 1
              return {"tool": "range-determinism.py", "deterministic": bool(result.get("deterministic")),
                      "tasks": result.get("tasks"), "same": result.get("same"), "differing": len(keys),
                      "tasksDiffering": keys[:100], "fields": fields, "problems": [str(item)[:300] for item in
                                                                                 result.get("problems") or []],
                      "policyCheats": len(result.get("policyCheats") or [])}


          def determinism(folder: str, source: str) -> bool:
              paths = [str(Path(folder, f"report-r{run}.json")) for run in (1, 2, 3)]
              reports = [read_report(path) or {} for path in paths]
              tool = Path(source, "hx/scripts/range-determinism.py") if source else None
              good = True
              if tool and tool.exists():
                  out = Path(folder, "determinism.json")
                  done = subprocess.run([sys.executable, str(tool), *paths, "--out", str(out)], capture_output=True)
                  result = read_report(out)
                  if result is None:
                      say(emit("DETERMINISM", {"tool": "range-determinism.py", "error": f"exit {done.returncode}"}))
                      good = False
                  else:
                      verdict = determinism_tool(result)
                      say(emit("DETERMINISM", verdict))
                      good = verdict["deterministic"] and not verdict["policyCheats"]
              else:
                  say(emit("DETERMINISM", {"tool": "range-determinism.py", "error": "not in this commit"}))
              normalized = determinism_normalized(reports)
              say(emit("DETERMINISM", normalized))
              return good and normalized["deterministic"]


          def b64_lines(path: str, name: str) -> list:
              raw = Path(path).read_bytes()
              packed = base64.b64encode(gzip.compress(raw, mtime=0)).decode("ascii")
              parts = chunks(packed, CHUNK) or [""]
              lines = [emit("B64BEGIN", {"name": name, "sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw),
                                         "chunks": len(parts)})]
              lines += [emit("B64", {"name": name, "i": index, "data": part}) for index, part in enumerate(parts)]
              lines.append(emit("B64END", {"name": name}))
              return lines


          def b64_rebuild(found: dict) -> dict:
              files = {}
              for begin in found["B64BEGIN"]:
                  name = begin["name"]
                  parts = {item["i"]: item["data"] for item in found["B64"] if item.get("name") == name}
                  if sorted(parts) != list(range(begin["chunks"])):
                      raise ValueError(f"{name}: chunks missing")
                  raw = gzip.decompress(base64.b64decode("".join(parts[index] for index in range(begin["chunks"]))))
                  if hashlib.sha256(raw).hexdigest() != begin["sha256"] or len(raw) != begin["bytes"]:
                      raise ValueError(f"{name}: checksum differs")
                  files[name] = raw
              return files


          def settings_from(values: dict, prefix: str, budget: int) -> dict:
              return {"only": str(values.get("only", "")), "pages": list(values.get("pages") or []),
                      "repeat": int(values.get("repeat", 1)), "faults": str(values.get("faults", "")),
                      "policy": str(values.get("policy", "v176")), "old": str(values.get("old", "")),
                      "shards": int(values.get("shards", 1)), "passes": int(values.get("passes", 1)),
                      "label": str(values.get("label", "")), "prefix": prefix, "budget": budget}


          def read_request(path: str) -> dict:
              request = json.loads(Path(path).read_text(encoding="utf-8"))
              values = {key: request.get(key, default) for key, default in (
                  ("only", ""), ("repeat", 1), ("faults", ""), ("policy", "v176"), ("old", ""), ("shards", 16),
                  ("passes", 1), ("label", ""), ("nonce", ""))}
              bad = check_inputs(values)
              pages = request.get("pages") or []
              if not isinstance(pages, list) or len(pages) > 5000 or any(
                      not isinstance(item, str) or not re.fullmatch(r"[A-Za-z0-9/_.-]{1,200}", item) or ".." in item
                      for item in pages):
                  bad.append("pages")
              if not re.fullmatch(r"[0-9a-f]{40}", str(request.get("base", ""))):
                  bad.append("base")
              if bad:
                  raise SystemExit("bad request fields: " + ", ".join(sorted(set(bad))))
              values["pages"] = pages
              values["base"] = request["base"]
              return values


          def check_request_commit(root: str, base: str) -> None:
              def git(*args: str) -> str:
                  return subprocess.run(["git", *args], cwd=root, capture_output=True, text=True, check=True).stdout.strip()
              parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()[1:]
              if not parents or parents[-1] != base:
                  raise SystemExit("the last parent of the request commit is not the commit to test")
              changed = set(git("diff", "--name-only", base, "HEAD").splitlines())
              if not changed <= REQUEST_FILES:
                  raise SystemExit(f"the request commit changes other files: {len(changed - REQUEST_FILES)}")
              git("checkout", "-q", "--detach", base)


          def runner_main(argv: list) -> int:
              command, args = (argv[0], argv[1:]) if argv else ("", [])
              if command == "fonts":
                  path = write_fonts(args[0])
                  if len(args) > 1:
                      with open(args[1], "a", encoding="utf-8") as env_file:
                          env_file.write(f"FONTCONFIG_FILE={path}\n")
                  return 0
              if command == "env":
                  say(emit("ENV", {"shard": int(args[0]) if args else 0, **env_info()}))
                  return 0
              if command == "settings":
                  values = {name: os.environ.get(f"HXR_{name.upper()}", "") for name in INPUT_RULES}
                  bad = check_inputs(values)
                  if bad:
                      print("bad inputs: " + ", ".join(sorted(set(bad))))
                      return 1
                  settings = settings_from(values, args[1] if len(args) > 1 else "gh", int(args[2]) if len(args) > 2 else 50)
                  Path(args[0]).write_text(json.dumps(settings), encoding="utf-8")
                  return 0
              if command == "request":
                  values = read_request(args[0])
                  check_request_commit(args[1], values["base"])
                  settings = settings_from(values, args[3] if len(args) > 3 else "al", int(args[4]) if len(args) > 4 else 130)
                  Path(args[2]).write_text(json.dumps(settings), encoding="utf-8")
                  return 0
              if command == "run":
                  settings = json.loads(Path(args[3]).read_text(encoding="utf-8"))
                  shards = list(range(1, settings["shards"] + 1)) if args[2] == "all" else [int(args[2])]
                  return 0 if run_shards(args[0], args[1], shards, settings) else 1
              if command == "scan":
                  secret = os.environ.get("HXR_SECRET", "")
                  hits = {}
                  for name in args:
                      path = Path(name)
                      if path.is_file():
                          found = scan_bytes(path.read_bytes(), SCAN_RULES, secret)
                          if found:
                              hits[path.name] = found
                  say(emit("SCAN", {"clean": not hits, "hits": hits}))
                  return 1 if hits else 0
              if command == "merge":
                  settings = json.loads(Path(args[2]).read_text(encoding="utf-8"))
                  only = settings["only"] if not settings.get("pages") else "pages:" + sha16(canonical(settings["pages"]))
                  return 0 if merge_folder(args[0], args[1], settings["shards"], settings["passes"], only) else 1
              if command == "determinism":
                  return 0 if determinism(args[0], args[1] if len(args) > 1 else "") else 1
              if command == "b64":
                  for path in args:
                      for line in b64_lines(path, Path(path).name):
                          say(line)
                  return 0
              print("commands: fonts env settings request run scan merge determinism b64")
              return 2


          SCAN_RULES = [[7,"6ffd1e189f62bb5109d2e3141354df549dcc100f1e051d67cee705006e01ac00","server address"],[7,"180a283ace5c553a797897a2e07a944ec5c324a470dea603f0f3e91efd2b4e00","company domain"],[7,"b76d7b10ea16da94a081f3484e766fdebd3c05f557225044825d2c889bf6b521","email"],[4,"8cacdce76244541a9ad6d2560dcdabf58af123e76c261e980537977352c3ef51","email"],[11,"1fe821ee5ae62e931b202ac1c0ef3298b1e4d80e788558a346a75937deae4e65","private key"],[14,"b598731ddec7f79c5a543a750a71903212f4f29bfb49b4ab821b5890a3a2d3c4","secret name"],[11,"47cd4f4e1defbeb3296234aef43f54206fef78616f442ac98c998e9c42d775c3","secret name"]]

          if __name__ == "__main__":
              sys.exit(runner_main(sys.argv[1:]))
          HXR
      - name: Check the inputs
        run: python3 "$RUNNER_TEMP/hxr.py" settings "$RUNNER_TEMP/settings.json" gh 50
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: hxbot-range-${{ inputs.label }}-*
          path: ${{ runner.temp }}/in
      - name: Merge
        id: merge
        run: |
          if python3 "$RUNNER_TEMP/hxr.py" merge "$RUNNER_TEMP/in" "$RUNNER_TEMP/merged" "$RUNNER_TEMP/settings.json"; then
            echo "status=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: inputs.passes == '3'
        with:
          repository: mercywangqiang-tech/hx-bot-build-2026-11-15-v170
          ref: ${{ inputs.ref }}
          token: ${{ secrets.HX_SOURCE_TOKEN }}
          persist-credentials: false
          path: src
          sparse-checkout: |
            hx/scripts
            scripts/hx-range
      - name: Check that the three runs agree
        id: same
        if: inputs.passes == '3'
        run: |
          if python3 "$RUNNER_TEMP/hxr.py" determinism "$RUNNER_TEMP/merged" "$GITHUB_WORKSPACE/src"; then
            echo "status=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the merged reports
        id: scan
        if: always()
        env:
          HXR_SECRET: ${{ secrets.HX_SOURCE_TOKEN }}
        run: |
          if python3 "$RUNNER_TEMP/hxr.py" scan "$RUNNER_TEMP"/merged/report-r*.json; then
            echo "clean=yes" >> "$GITHUB_OUTPUT"
          else
            echo "clean=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.scan.outputs.clean == 'yes'
        with:
          name: hxbot-range-${{ inputs.label }}
          path: ${{ runner.temp }}/merged/report-r*.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove the source
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/in" "$RUNNER_TEMP/merged"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Result
        if: always()
        env:
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          SAME_STATUS: ${{ steps.same.outputs.status || '0' }}
          CLEAN: ${{ steps.scan.outputs.clean }}
        run: test "$MERGE_STATUS" = 0 && test "$SAME_STATUS" = 0 && test "$CLEAN" = yes
