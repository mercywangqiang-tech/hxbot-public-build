          PREFIX = "HXRANGE"
          COMPARED = ("ok", "falseSuccess", "falseFailure", "steps", "calls")
          FAIL_CAP = 500
          TASK_LINES_MAX = 300
          CHUNK = 16000
          VOLATILE = (
